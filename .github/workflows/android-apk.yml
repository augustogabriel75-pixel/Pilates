name: Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas Android (pacotes Ubuntu)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt zipalign apksigner dalvik-exchange

      # Para que as atualizações do app instalem por cima da versão anterior, cadastre em
      # Settings → Secrets → Actions: ANDROID_KEYSTORE_BASE64 (base64 do .jks) e ANDROID_KEYSTORE_PASSWORD.
      - name: Restaurar keystore de assinatura
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p android/keystore
            echo "$KEYSTORE_B64" | base64 -d > android/keystore/cativar-release.jks
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado — o APK será assinado com uma chave temporária e não poderá atualizar instalações existentes."
          fi

      - name: Gerar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then unset KEYSTORE_PASSWORD; fi
          ./android/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: EspacoCativarPilates-apk
          path: android/dist/*.apk
          if-no-files-found: error
